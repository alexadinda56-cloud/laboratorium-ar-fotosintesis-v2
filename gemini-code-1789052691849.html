<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorium AR Fotosintesis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background-color: #f4f6f8; }
    #canvas-container { flex: 1; position: relative; background: linear-gradient(to bottom, #e0f7fa 60%, #d7ccc8 60%); }
    #sidebar { width: 340px; background: #ffffff; border-left: 1px solid #e0e0e0; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
    h2 { font-size: 1.2rem; color: #2e7d32; margin-bottom: 15px; }
    .step-btn { background: #f1f8e9; border: 1px solid #c8e6c9; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; text-align: left; transition: all 0.2s; }
    .step-btn:hover, .step-btn.active { background: #a5d6a7; border-color: #4caf50; font-weight: bold; }
    .info-box { margin-top: 15px; padding: 15px; background: #e8f5e9; border-radius: 8px; font-size: 0.9rem; color: #1b5e20; }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls agar model bisa diputar/dizoom -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="sidebar">
    <h2>Tahapan Fotosintesis</h2>
    <button class="step-btn active" onclick="selectStep(1)">1. Air Diserap Akar</button>
    <button class="step-btn" onclick="selectStep(2)">2. Air Menuju Daun</button>
    <button class="step-btn" onclick="selectStep(3)">3. CO₂ Masuk Daun</button>
    <button class="step-btn" onclick="selectStep(4)">4. Cahaya Matahari</button>
    <button class="step-btn" onclick="selectStep(5)">5. Hasil Fotosintesis</button>

    <div class="info-box" id="info-text">
      <strong>1. Air Diserap Akar:</strong> Akar menyerap air (H₂O) dari dalam tanah untuk disalurkan ke seluruh bagian tumbuhan.
    </div>
  </div>

  <script>
    // 1. Setup Scene, Camera, Renderer
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 2, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 2. Pencahayaan
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 12, 8);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 3. Objek 3D Pohon & Tanah (Rapi)
    const plantGroup = new THREE.Group();

    // Permukaan Tanah
    const groundGeo = new THREE.CylinderGeometry(4, 4, 0.2, 32);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = -1;
    plantGroup.add(ground);

    // Batang Utama
    const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 4, 16);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5d4037 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 1;
    plantGroup.add(trunk);

    // Daun (Kanopi Rindang)
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, flatShading: true });
    
    function createLeafCluster(x, y, z, scale) {
      const leafGeo = new THREE.DodecahedronGeometry(scale);
      const leafMesh = new THREE.Mesh(leafGeo, leafMat);
      leafMesh.position.set(x, y, z);
      plantGroup.add(leafMesh);
    }

    createLeafCluster(0, 3.2, 0, 1.2);
    createLeafCluster(-0.8, 2.8, 0.5, 0.9);
    createLeafCluster(0.8, 2.8, -0.5, 0.9);
    createLeafCluster(0, 2.7, -0.8, 0.8);

    // Akar (Di bawah tanah)
    const rootMat = new THREE.MeshStandardMaterial({ color: 0x3e2723 });
    function createRoot(rotZ, posX) {
      const rootGeo = new THREE.ConeGeometry(0.1, 1.5, 8);
      const root = new THREE.Mesh(rootGeo, rootMat);
      root.position.set(posX, -1.6, 0);
      root.rotation.z = rotZ;
      plantGroup.add(root);
    }

    createRoot(0.5, -0.4);
    createRoot(-0.5, 0.4);
    createRoot(0.2, -0.1);

    scene.add(plantGroup);

    // 4. Penjelasan Tiap Langkah
    const stepInfo = {
      1: "<strong>1. Air Diserap Akar:</strong> Akar menyerap air (H₂O) dari dalam tanah untuk disalurkan ke bagian tumbuhan.",
      2: "<strong>2. Air Menuju Daun:</strong> Air naik melalui pembuluh kayu (xilem) di batang menuju ke daun.",
      3: "<strong>3. CO₂ Masuk Daun:</strong> Karbon dioksida (CO₂) dari udara masuk ke dalam daun melalui stomata.",
      4: "<strong>4. Cahaya Matahari:</strong> Klorofil pada daun menyerap energi cahaya matahari untuk proses reaksi.",
      5: "<strong>5. Hasil Fotosintesis:</strong> Reaksi menghasilkan Glukosa (makanan) dan Oksigen (O₂) yang dilepas ke udara."
    };

    function selectStep(step) {
      document.getElementById('info-text').innerHTML = stepInfo[step];
      const btns = document.querySelectorAll('.step-btn');
      btns.forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === step);
      });
    }

    // 5. Animation Loop & Responsive Window
    function animate() {
      requestAnimationFrame(animate);
      plantGroup.rotation.y += 0.003; // Rotasi perlahan
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
  </script>
</body>
</html>
